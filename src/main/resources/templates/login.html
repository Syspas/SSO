<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SSO — вход</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2332;
            --text: #e7ecf3;
            --muted: #9aa8bc;
            --accent: #3d8bfd;
            --danger: #e35d6a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(1200px 600px at 20% 0%, #1b2a44, var(--bg));
            color: var(--text);
        }
        form {
            width: min(360px, 92vw);
            padding: 1.75rem;
            background: color-mix(in srgb, var(--card) 92%, transparent);
            border: 1px solid #2a3a52;
            border-radius: 12px;
        }
        h1 { margin: 0 0 .25rem; font-size: 1.35rem; }
        p { margin: 0 0 1.25rem; color: var(--muted); font-size: .9rem; }
        label { display: block; margin: .75rem 0 .35rem; font-size: .85rem; color: var(--muted); }
        input {
            width: 100%;
            padding: .65rem .75rem;
            border-radius: 8px;
            border: 1px solid #33465f;
            background: #0d121a;
            color: var(--text);
        }
        button {
            margin-top: 1.25rem;
            width: 100%;
            padding: .7rem;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .err { color: var(--danger); margin-bottom: .75rem; font-size: .9rem; }
        .ok { color: #6bcb8b; margin-bottom: .75rem; font-size: .9rem; }
    </style>
</head>
<body>
<form th:action="@{/login}" method="post">
    <h1>SSO</h1>
    <p>Единый вход для портала и Excel</p>
    <div class="err" th:if="${param.error}">Неверный email или пароль</div>
    <div class="ok" th:if="${param.logout}">Вы вышли из SSO</div>
    <label for="username">Email</label>
    <input id="username" name="username" type="email" autocomplete="username" required autofocus/>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required/>
    <button type="submit">Войти</button>
</form>
</body>
</html>
